<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QC ST Dashboard</title>
    <link rel="preconnect" href="https://script.google.com">
    <link id="favicon" rel="icon" type="image/png" href="./P%20Logo_Grey.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: {
                brandBase: '#F9F8F5', brandSurface: '#FFFFFF', brandPrimary: '#111827', 
                brandSecondary: '#6B7280', brandSuccess: '#10B981', brandStudent: '#0284C7', brandBorder: '#E5E7EB',
                brandCritical: '#FA8072', brandWarning: '#F59E0B'
            }}}
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .btn-gradient { background: #111827; color: #FFFFFF; font-weight: 600; transition: all 0.2s ease; }
        .btn-gradient:hover { background: #1F2937; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .dark .btn-gradient { background: #E5E7EB; color: #111827; }
        .dark .btn-gradient:hover { background: #FFFFFF; }
        .input-ring:focus { outline: none; box-shadow: 0 0 0 2px #0284C7; border-color: #0284C7; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .animate-swoop { animation: swoopIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes swoopIn { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        .dark .skeleton { background: linear-gradient(90deg, #374151 25%, #4B5563 50%, #374151 75%); }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #E5E7EB; vertical-align: top; }
        .dark th, .dark td { border-bottom: 1px solid #374151; }
        th { color: #6B7280; font-weight: 600; font-size: 11px; text-transform: uppercase; background: #F9F8F5; }
        .dark th { color: #9CA3AF; background: #1F2937; }
    </style>
</head>
<body class="bg-brandBase dark:bg-gray-900 text-brandPrimary dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col relative transition-colors duration-300">

    <!-- Global Banners -->
    <div id="globalError" class="hidden opacity-0 transition-opacity duration-300 fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-100 border border-red-400 text-red-700 px-6 py-3 rounded-lg shadow-md z-50 text-sm font-medium"></div>
    <div id="globalSuccess" class="hidden opacity-0 transition-opacity duration-300 fixed top-4 left-1/2 transform -translate-x-1/2 bg-green-100 border border-green-400 text-green-700 px-6 py-3 rounded-lg shadow-md z-50 text-sm font-medium"></div>

    <!-- PIN Screen -->
    <div id="loginSection" class="w-full max-w-sm mx-auto mt-20 transition-opacity duration-300 opacity-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-brandPrimary dark:text-white tracking-tight uppercase">QC ST Dashboard</h1>
            <p class="text-brandSecondary dark:text-gray-400 text-sm mt-1">Holistic Location Tracking</p>
        </div>
        <div class="bg-brandSurface dark:bg-gray-800 p-8 rounded-2xl shadow-sm border border-brandBorder dark:border-gray-700">
            <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1.5">Company PIN</label>
            <input type="password" id="pinInput" onkeypress="if(event.key === 'Enter') handleLogin()" class="w-full bg-brandBase dark:bg-gray-900 border border-brandBorder dark:border-gray-700 rounded-lg px-4 py-3 text-brandPrimary dark:text-white input-ring text-center tracking-widest text-lg mb-4 outline-none" placeholder="••••••">
            <button onclick="handleLogin()" class="w-full btn-gradient rounded-lg py-3 flex justify-center items-center text-sm">Unlock Dashboard</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="appSection" class="hidden opacity-0 w-full pb-20">
        <!-- Sticky Header -->
        <header class="sticky top-0 z-30 bg-brandSurface/95 dark:bg-gray-800/95 backdrop-blur-md border-b border-brandBorder dark:border-gray-700 px-4 py-3 sm:px-6 shadow-sm">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <h1 class="text-lg font-bold text-brandPrimary dark:text-white hidden md:block">QC ST Dashboard</h1>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search students..." class="w-full md:w-64 bg-gray-50 dark:bg-gray-900 border border-brandBorder dark:border-gray-600 rounded-lg px-3 py-1.5 text-sm outline-none input-ring">
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <select id="picSelect" onchange="fetchData()" class="bg-gray-50 dark:bg-gray-900 border border-brandBorder dark:border-gray-600 rounded-lg px-3 py-1.5 text-sm outline-none max-w-[140px] truncate">
                        <option value="all">Global Roster</option>
                        <!-- Injected via JS -->
                    </select>
                    <button onclick="fetchData()" class="btn-gradient px-3 py-1.5 rounded-lg text-xs flex-shrink-0">Sync</button>
                    <button onclick="toggleTheme()" class="text-brandSecondary hover:text-brandPrimary dark:hover:text-white text-lg ml-1">🌓</button>
                    <button onclick="logout()" class="text-xs text-brandSecondary hover:text-brandPrimary dark:hover:text-white font-medium ml-1">Lock</button>
                </div>
            </div>
        </header>

        <!-- Skeleton -->
        <div id="skeletonLoader" class="hidden max-w-6xl mx-auto p-4 sm:p-6 animate-pulse">
            <div class="h-8 bg-gray-200 dark:bg-gray-700 w-48 mb-6 rounded"></div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="h-24 bg-gray-200 dark:bg-gray-700 rounded-2xl w-full"></div><div class="h-24 bg-gray-200 dark:bg-gray-700 rounded-2xl w-full"></div>
                <div class="h-24 bg-gray-200 dark:bg-gray-700 rounded-2xl w-full"></div><div class="h-24 bg-gray-200 dark:bg-gray-700 rounded-2xl w-full"></div>
            </div>
            <div class="h-40 bg-gray-200 dark:bg-gray-700 rounded-2xl w-full"></div>
        </div>

        <!-- Dashboard Content -->
        <main id="dashboardContent" class="max-w-6xl mx-auto p-4 sm:p-6 space-y-8 hidden fade-in">
            <!-- Macro Cards -->
            <section class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                <div class="bg-brandSurface dark:bg-gray-800 p-4 rounded-2xl border border-brandBorder dark:border-gray-700 shadow-sm flex flex-col items-center">
                    <span class="text-brandSecondary text-[10px] sm:text-xs uppercase font-bold tracking-wider mb-1">Active Flags</span>
                    <span id="metric-flags" class="text-3xl font-black">0</span>
                </div>
                <div class="bg-brandSurface dark:bg-gray-800 p-4 rounded-2xl border border-brandBorder dark:border-gray-700 shadow-sm flex flex-col items-center">
                    <span class="text-brandSecondary text-[10px] sm:text-xs uppercase font-bold tracking-wider mb-1">Missing Post</span>
                    <span id="metric-post" class="text-3xl font-black">0</span>
                </div>
                <div class="bg-brandSurface dark:bg-gray-800 p-4 rounded-2xl border border-brandBorder dark:border-gray-700 shadow-sm flex flex-col items-center">
                    <span class="text-brandSecondary text-[10px] sm:text-xs uppercase font-bold tracking-wider mb-1">Missing Nomad</span>
                    <span id="metric-nomad" class="text-3xl font-black">0</span>
                </div>
                <div id="metric-watch-card" class="bg-brandSurface dark:bg-gray-800 p-4 rounded-2xl border border-brandBorder dark:border-gray-700 shadow-sm flex flex-col items-center transition-colors">
                    <span class="text-brandSecondary text-[10px] sm:text-xs uppercase font-bold tracking-wider mb-1" id="metric-watch-title">High Priority Alerts</span>
                    <span id="metric-watch" class="text-3xl font-black">0</span>
                </div>
            </section>

            <!-- Action Items (Vertically Stacked Accordions) -->
            <section class="space-y-4">
                <details class="bg-brandSurface dark:bg-gray-800 rounded-2xl border border-brandBorder dark:border-gray-700 shadow-sm overflow-hidden" open>
                    <summary class="p-5 font-bold text-gray-900 dark:text-white text-sm sm:text-base cursor-pointer list-none flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700/50">
                        <div class="flex items-center gap-2">⚠️ Missing Data Collection</div>
                        <span class="text-brandSecondary text-xs">Click to toggle</span>
                    </summary>
                    <div class="p-5 pt-0 border-t border-brandBorder dark:border-gray-700 mt-1">
                        <ul id="missing-data-list" class="space-y-2 mt-4 text-sm text-brandSecondary italic"></ul>
                    </div>
                </details>
                
                <details class="bg-brandSurface dark:bg-gray-800 rounded-2xl border border-brandBorder dark:border-gray-700 shadow-sm overflow-hidden" open>
                    <summary class="p-5 font-bold text-gray-900 dark:text-white text-sm sm:text-base cursor-pointer list-none flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-700/50">
                        <div class="flex items-center gap-2">🚩 Academic & Behavior Alerts</div>
                        <span class="text-brandSecondary text-xs">Click to toggle</span>
                    </summary>
                    <div class="p-5 pt-0 border-t border-brandBorder dark:border-gray-700 mt-1">
                        <ul id="behavior-flag-list" class="space-y-2 mt-4 text-sm text-brandSecondary italic"></ul>
                    </div>
                </details>
            </section>

            <!-- Roster Section -->
            <section>
                <h3 class="font-bold text-gray-900 dark:text-white mb-4 text-lg">Student Roster</h3>
                <div id="roster-container" class="space-y-6"></div>
            </section>
        </main>
        
        <button id="backToTopBtn" onclick="window.scrollTo(0,0)" class="hidden fixed bottom-6 right-6 bg-brandPrimary dark:bg-gray-600 text-white p-3 rounded-full shadow-lg hover:scale-110 transition-transform z-50">↑</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyUu4cWBKoQDR3_bIG6jOIjfwkK7g1ID3FdqZJq_Deal_JUvhF2eLEP66WkbFm9JKeR/exec";
        const APP_PIN = "237147";
        let dashboardCache = null; // Stores payload for search filtering

        // INIT & THEME
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            if (localStorage.getItem('qc_pin_verified') === 'true') {
                const savedPic = localStorage.getItem('qc_pic_select');
                if(savedPic) document.getElementById('picSelect').value = savedPic;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden', 'opacity-0');
                fetchData();
            }
        });

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        // BANNERS
        function fadeOut(id) {
            const el = document.getElementById(id);
            el.classList.remove('opacity-100'); el.classList.add('opacity-0');
            setTimeout(() => { el.classList.add('hidden'); }, 300);
        }
        function showGlobalBanner(id, message) {
            const banner = document.getElementById(id);
            banner.innerText = message;
            banner.classList.remove('hidden'); void banner.offsetWidth;
            banner.classList.remove('opacity-0'); banner.classList.add('opacity-100');
            setTimeout(() => { fadeOut(id); }, 3000);
        }

        // AUTH
        function handleLogin() {
            if (document.getElementById('pinInput').value === APP_PIN) {
                localStorage.setItem('qc_pin_verified', 'true');
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                void document.getElementById('appSection').offsetWidth;
                document.getElementById('appSection').classList.add('animate-swoop', 'opacity-100');
                fetchData();
            } else {
                showGlobalBanner('globalError', "Incorrect PIN.");
            }
        }
        function logout() {
            localStorage.removeItem('qc_pin_verified');
            document.getElementById('appSection').classList.remove('opacity-100', 'animate-swoop');
            document.getElementById('appSection').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('appSection').classList.add('hidden');
                document.getElementById('pinInput').value = '';
                document.getElementById('loginSection').classList.remove('hidden');
            }, 300);
        }

        // FETCHING
        async function fetchData() {
            const pic = document.getElementById('picSelect').value;
            localStorage.setItem('qc_pic_select', pic);
            
            document.getElementById('dashboardContent').classList.add('hidden');
            document.getElementById('skeletonLoader').classList.remove('hidden');

            try {
                const res = await fetch(`${API_URL}?action=getDashboardData&pic_name=${pic}`);
                const json = await res.json();
                if(json.status === 'success') {
                    dashboardCache = json.data; // Cache for search logic
                    populatePicDropdown(json.data.pics, pic);
                    renderDashboard(json.data);
                    document.getElementById('skeletonLoader').classList.add('hidden');
                    document.getElementById('dashboardContent').classList.remove('hidden');
                    showGlobalBanner('globalSuccess', 'Data synchronized.');
                } else showGlobalBanner('globalError', "Error: " + json.message);
            } catch (err) {
                showGlobalBanner('globalError', "Network busy. Retrying later.");
            }
        }

        function populatePicDropdown(picsArray, currentVal) {
            const select = document.getElementById('picSelect');
            select.innerHTML = '<option value="all">Global Roster</option>';
            picsArray.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p; opt.innerText = `${p}'s Students`;
                if(p === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function getHealthBadge(healthStr, alertText) {
            if(healthStr === 'Excellent') return `<span class="px-2 py-0.5 rounded bg-brandSuccess/20 text-brandSuccess text-[10px] font-bold uppercase ml-2">Excellent</span>`;
            if(healthStr === 'Average') return `<span class="px-2 py-0.5 rounded bg-brandWarning/20 text-brandWarning text-[10px] font-bold uppercase ml-2">Average</span>`;
            return `<span class="px-2 py-0.5 rounded bg-brandCritical/20 text-brandCritical text-[10px] font-bold uppercase ml-2" title="${alertText}">Help Needed</span>`;
        }

        function renderDashboard(data) {
            // Metrics
            document.getElementById('metric-flags').innerText = data.summary.total_flags;
            document.getElementById('metric-post').innerText = data.summary.missing_post;
            document.getElementById('metric-nomad').innerText = data.summary.missing_nomad;
            
            const watchCard = document.getElementById('metric-watch-card');
            const watchText = document.getElementById('metric-watch');
            const watchTitle = document.getElementById('metric-watch-title');
            watchText.innerText = data.summary.critical_watchlist;
            if (data.summary.critical_watchlist > 0) {
                watchCard.className = "bg-red-50 dark:bg-red-900/20 p-4 rounded-2xl border border-red-200 dark:border-red-800 shadow-sm flex flex-col items-center";
                watchText.className = "text-3xl font-black text-brandCritical";
                watchTitle.className = "text-brandCritical text-[10px] sm:text-xs uppercase font-bold tracking-wider mb-1";
            } else {
                watchCard.className = "bg-brandSurface dark:bg-gray-800 p-4 rounded-2xl border border-brandBorder dark:border-gray-700 shadow-sm flex flex-col items-center";
                watchText.className = "text-3xl font-black text-brandPrimary dark:text-white";
                watchTitle.className = "text-brandSecondary text-[10px] sm:text-xs uppercase font-bold tracking-wider mb-1";
            }

            // Flags
            document.getElementById('missing-data-list').innerHTML = data.action_items.missing_data.length ? data.action_items.missing_data.map(f => 
                `<li class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-xl flex justify-between cursor-pointer hover:bg-red-100 dark:hover:bg-red-900/40" onclick="jumpToStudent('${f.student_id}')">
                    <div><b class="text-brandPrimary dark:text-white">${f.student_name}</b><br><span class="text-xs text-brandCritical">${f.type}</span></div>
                    <span class="text-[10px] text-brandSecondary bg-brandSurface dark:bg-gray-800 px-2 py-1 rounded shadow-sm border border-brandBorder dark:border-gray-700 h-fit">${f.session}</span>
                </li>`).join('') : `<div class="text-brandSuccess font-bold text-center py-4 bg-green-50 dark:bg-green-900/10 rounded-xl border border-green-100">🎉 Caught up!</div>`;

            document.getElementById('behavior-flag-list').innerHTML = data.action_items.alerts.length ? data.action_items.alerts.map(f => 
                `<li class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-xl flex justify-between cursor-pointer hover:bg-red-100 dark:hover:bg-red-900/40" onclick="jumpToStudent('${f.student_id}')">
                    <div><b class="text-brandPrimary dark:text-white">${f.student_name}</b><br><span class="text-xs text-brandCritical">${f.reasons}</span></div>
                </li>`).join('') : `<div class="text-brandSuccess font-bold text-center py-4 bg-green-50 dark:bg-green-900/10 rounded-xl border border-green-100">🎉 No active alerts!</div>`;

            renderRoster(data.roster_by_level);
        }

        // Render Expanding Table Rows
        function renderRoster(rosterData) {
            const container = document.getElementById('roster-container');
            container.innerHTML = '';
            
            const sortedLevels = Object.keys(rosterData).sort((a,b) => parseInt(a.split('_')[0]) - parseInt(b.split('_')[0]));
            if(sortedLevels.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-brandSuccess font-bold text-lg bg-brandSurface rounded-2xl border">All clear! No students.</div>';
                return;
            }

            sortedLevels.forEach(levelKey => {
                const levelDisplay = levelKey.split('_')[1];
                const students = rosterData[levelKey];
                
                let courseHTML = `
                <details class="mb-4 level-accordion group" id="level-${levelKey}" open>
                    <summary class="font-bold text-brandPrimary dark:text-white bg-brandSurface dark:bg-gray-800 p-4 rounded-xl border border-brandBorder dark:border-gray-700 shadow-sm cursor-pointer list-none flex items-center justify-between hover:border-brandStudent transition-colors">
                        ${levelDisplay} <span class="text-xs font-normal text-brandSecondary bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded-full">${students.length} Students</span>
                    </summary>
                    <div class="space-y-3 mt-3 px-1 student-list">`;
                
                students.forEach(student => {
                    let historyRows = student.history.map(h => {
                        let attCol = h.att <= 2 ? `text-brandCritical font-bold` : `text-brandSecondary`;
                        let motCol = h.mot <= 2 ? `text-brandCritical font-bold` : `text-brandSecondary`;
                        return `
                        <tr>
                            <td class="font-semibold text-brandPrimary dark:text-gray-200 whitespace-nowrap">Session ${h.session}</td>
                            <td class="text-brandSecondary whitespace-nowrap">${h.date}</td>
                            <td class="text-brandSecondary whitespace-nowrap">${h.teacher}</td>
                            <td class="text-brandPrimary dark:text-gray-200 font-medium">${h.pre}</td>
                            <td class="text-brandPrimary dark:text-gray-200 font-medium">${h.post}</td>
                            <td class="text-xs">
                                <span class="${attCol} block">Att: ${h.att}</span>
                                <span class="${motCol} block">Mot: ${h.mot}</span>
                            </td>
                            <td class="text-xs text-brandSecondary leading-relaxed min-w-[200px]">${h.comments || '<i>Pending review</i>'}</td>
                        </tr>`;
                    }).join('');
                    
                    if(student.history.length === 0) historyRows = `<tr><td colspan="7" class="text-center text-brandSecondary italic py-4">No past classes recorded.</td></tr>`;

                    courseHTML += `
                    <details class="bg-white dark:bg-gray-800 border border-brandBorder dark:border-gray-700 rounded-lg overflow-hidden student-item" id="student-${student.student_id}" data-name="${student.student_name.toLowerCase()}">
                        <summary class="flex justify-between items-center p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 cursor-pointer list-none outline-none">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-sm text-brandPrimary dark:text-white">${student.student_name}</h4>
                                ${getHealthBadge(student.health, student.alert_reasons)}
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-brandSecondary hidden sm:block">ID: ${student.student_id}</span>
                                <span class="text-brandSecondary font-bold group-open:rotate-180 transition-transform">⌄</span>
                            </div>
                        </summary>
                        <div class="border-t border-brandBorder dark:border-gray-700 overflow-x-auto">
                            <table class="w-full">
                                <thead>
                                    <tr>
                                        <th>Session</th><th>Date</th><th>Teacher</th><th>Pre</th><th>Post</th><th>Nomad</th><th>Teacher Comments</th>
                                    </tr>
                                </thead>
                                <tbody>${historyRows}</tbody>
                            </table>
                        </div>
                    </details>`;
                });
                container.innerHTML += courseHTML + `</div></details>`;
            });
        }

        // SEARCH & NAVIGATION LOGIC
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const accordions = document.querySelectorAll('.level-accordion');
            
            accordions.forEach(acc => {
                let hasMatch = false;
                const students = acc.querySelectorAll('.student-item');
                students.forEach(st => {
                    if (st.getAttribute('data-name').includes(query)) {
                        st.style.display = 'block'; hasMatch = true;
                    } else st.style.display = 'none';
                });
                
                if (hasMatch) { acc.style.display = 'block'; acc.open = true; } 
                else acc.style.display = 'none';
                
                if (query === '') acc.open = true; // Default open when empty
            });
        }

        function jumpToStudent(id) {
            document.getElementById('searchInput').value = ''; handleSearch(); // Clear search
            const el = document.getElementById(`student-${id}`);
            if(el) {
                // Ensure parent accordion is open
                const parentAcc = el.closest('.level-accordion');
                if(parentAcc) parentAcc.open = true;
                
                el.open = true;
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // Highlight flash
                const summary = el.querySelector('summary');
                const origBg = summary.className;
                summary.classList.add('bg-brandStudent/10');
                setTimeout(() => { summary.classList.remove('bg-brandStudent/10'); }, 1500);
            }
        }
    </script>
</body>
</html>
